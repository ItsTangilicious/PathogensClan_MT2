name = "PathogensClan_MT2"
versionNumber = "0.1.0"
description = "The Last Divinity succumbed to sicknes. Can the Hellborne Pathogens topple the new Titans as well? Back from Monster Train 1, the Hellborne Pathogens Clan has returned!"
